<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمایشگاه QR</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.8;
    }
    .box {
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin-top: 20px;
    }
    code {
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>🧪 آزمایشگاه QR</h1>
  <p>این صفحه فقط اطلاعات عمومی مرورگر را روی همین صفحه نمایش می‌دهد.</p>

  <div class="box">
    <p><b>مرورگر:</b> <span id="browser"></span></p>
    <p><b>سیستم‌عامل تقریبی:</b> <span id="os"></span></p>
    <p><b>زبان مرورگر:</b> <span id="language"></span></p>
    <p><b>اندازه صفحه:</b> <span id="screen"></span></p>
    <p><b>زمان محلی:</b> <span id="time"></span></p>
  </div>

  <script>
    document.getElementById("browser").textContent =
      navigator.userAgent;

    document.getElementById("os").textContent =
      navigator.platform || "نامشخص";

    document.getElementById("language").textContent =
      navigator.language;

    document.getElementById("screen").textContent =
      screen.width + " × " + screen.height;

    document.getElementById("time").textContent =
      new Date().toLocaleString();
  </script>

</body>
</html>
